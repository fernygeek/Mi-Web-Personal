    <main class="pagina-interior">
        <section>
            <h1>Contáctame</h1>
            <p class="form-ayuda">Completa los campos obligatorios.</p>
            <form id="formulario-contacto" novalidate>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                placeholder="Ingrese su nombre" autocomplete="name" required>
                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" autocomplete="email" required>
                <label for="celular">Celular:</label>
                <input type="tel" id="celular" name="celular" pattern="09[0-9]{8}" inputmode="numeric" placeholder="0991234567" autocomplete="tel" required>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escriba su mensaje" required></textarea>
                <div class="acciones-formulario">
                    <button type="submit" class="btn-enviar">Validar formulario</button>
                    <button type="reset" class="btn-secundario">Limpiar</button>
                </div>
                <p id="estado-formulario" class="estado-formulario" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script>
        const formulario = document.querySelector("#formulario-contacto");
        const estado = document.querySelector("#estado-formulario");

        formulario.addEventListener("submit", (evento) => {
            evento.preventDefault();
            estado.className = "estado-formulario";

            if (!formulario.checkValidity()) {
                estado.textContent = "Revisa los campos marcados: completa la información y verifica el formato del celular.";
                estado.classList.add("error");
                formulario.reportValidity();
                return;
            }

            estado.textContent = "Formulario validado correctamente. Esta versión estática no envía datos todavía.";
            estado.classList.add("exito");
        });

        formulario.addEventListener("reset", () => {
            estado.textContent = "";
            estado.className = "estado-formulario";
        });
    </script>
<footer><div>© 2026 Fernanda Rueda. Todos los derechos reservados.</div></footer>

</html>
